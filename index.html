<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場勘查與設施照片即時圖台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; color: #222; }
    .header {
      position: sticky; top: 0; z-index: 100; background: #1a73e8; color: #fff;
      padding: 12px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .header-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
    .header h1 { margin: 0; font-size: 18px; }
    .badge { background: rgba(255,255,255,0.25); padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    .search-box { padding: 7px 12px; border: none; border-radius: 6px; font-size: 14px; flex: 1; min-width: 160px; }
    .btn-sync {
      background: #fff; color: #1a73e8; border: none; border-radius: 6px;
      padding: 7px 12px; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .cat-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .cat-btn {
      background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.4);
      border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .cat-btn.active { background: #fff; color: #1a73e8; font-weight: bold; border-color: #fff; }
    .container { max-width: 1200px; margin: 16px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column;
    }
    .photo-strip {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #eee; position: relative;
    }
    .photo-strip a { flex: 0 0 100%; scroll-snap-align: start; display: block; position: relative; }
    .photo-strip img { width: 100%; height: 215px; object-fit: cover; display: block; }
    .photo-count {
      position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.65);
      color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .card-title { font-size: 16px; font-weight: bold; color: #1a73e8; margin: 0; }
    .cat-tag {
      background: #e8f0fe; color: #1967d2; font-size: 12px; font-weight: bold;
      padding: 2px 8px; border-radius: 6px; white-space: nowrap;
    }
    .row { font-size: 13px; margin-bottom: 5px; line-height: 1.5; }
    .label { font-weight: bold; color: #555; }
    .map-link {
      margin-top: auto; display: block; text-align: center; background: #34a853; color: #fff;
      text-decoration: none; padding: 9px; border-radius: 6px; font-weight: bold; font-size: 14px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📍 現場勘查即時圖台</h1>
    <span class="badge" id="status">讀取中...</span>
    <input type="text" class="search-box" id="kw" placeholder="搜尋說明、位置或拍攝日期..." oninput="render()">
    <button class="btn-sync" onclick="loadData()">🔄 立即同步</button>
  </div>
  <div class="cat-bar" id="catBar"></div>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwCRRutky3s005vMyGbJCeSg5q8OtKu_qTBXqtWDHHehR8yKGfuQ-E2OXsaJP63MJOVrQ/exec";

  let allPoints = [];
  let selectedCat = "全部";

  async function loadData() {
    const status = document.getElementById('status');
    status.innerText = "同步中...";
    try {
      const res = await fetch(GAS_URL + "?action=data");
      const json = await res.json();
      if (json.status === "ok") {
        allPoints = json.points || [];
        buildCategoryButtons();
        render();
      } else {
        status.innerText = "讀取錯誤：" + json.message;
      }
    } catch (err) {
      status.innerText = "連線異常";
    }
  }

  function buildCategoryButtons() {
    const preset = ["全部", "橋梁", "綠美化", "路容", "交通(標誌牌面)", "交通(標線)", "照明", "邊坡", "排水", "坑洞", "公路養護", "其他"];
    const dynamicCats = [...new Set(allPoints.map(p => p.category).filter(c => c && !preset.includes(c)))];
    const cats = [...preset, ...dynamicCats];

    document.getElementById('catBar').innerHTML = cats.map(c =>
      `<button class="cat-btn ${c === selectedCat ? 'active' : ''}" onclick="selectCat(this.dataset.cat)" data-cat="${esc(c)}">${esc(c)}</button>`
    ).join('');
  }

  function selectCat(cat) {
    selectedCat = cat;
    buildCategoryButtons();
    render();
  }

  function render() {
    const kw = document.getElementById('kw').value.trim().toLowerCase();
    const list = allPoints.filter(p => {
      const matchCat = (selectedCat === "全部") || (p.category === selectedCat);
      const matchKw = !kw || (p.desc + p.date + p.address + p.category).toLowerCase().includes(kw);
      return matchCat && matchKw;
    });

    document.getElementById('status').innerText = `共 ${list.length} 筆`;
    const grid = document.getElementById('grid');

    if (list.length === 0) {
      grid.innerHTML = "<p>此分類目前沒有巡檢紀錄。</p>";
      return;
    }

    grid.innerHTML = list.map(p => {
      const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
      const photos = p.photos || [];
      const photoHtml = photos.length > 0 ? `
        <div class="photo-strip">
          ${photos.map((ph, idx) => `
            <a href="${ph.orig}" target="_blank">
              <img src="${ph.thumb}" alt="現場照片 ${idx + 1}">
              ${photos.length > 1 ? `<span class="photo-count">照片 ${idx + 1} / ${photos.length}（左右滑動）</span>` : ''}
            </a>
          `).join('')}
        </div>
      ` : '';

      return `
        <div class="card">
          ${photoHtml}
          <div class="card-body">
            <div class="card-header-row">
              <div class="card-title">${esc(p.desc)}</div>
              <span class="cat-tag">${esc(p.category)}</span>
            </div>
            <div class="row"><span class="label">🗺️ 位置：</span>${esc(p.address)}</div>
            <div class="row"><span class="label">🌐 座標：</span>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
            <div class="row"><span class="label">📅 拍攝日期：</span>${esc(p.date)}</div>
            <a class="map-link" href="${gmapUrl}" target="_blank">🗺️ 在 Google 地圖開啟定位</a>
          </div>
        </div>
      `;
    }).join('');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s || "");
    return d.innerHTML.replace(/"/g, """);
  }

  loadData();
</script>
</body>
</html>
