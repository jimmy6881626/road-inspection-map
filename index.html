<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場勘查與設施照片即時圖台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; color: #222; }
    .header {
      position: sticky; top: 0; z-index: 100; background: #1a73e8; color: #fff;
      padding: 12px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    }
    .header h1 { margin: 0; font-size: 18px; }
    .badge { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 12px; font-size: 13px; }
    .search-box {
      padding: 7px 12px; border: none; border-radius: 6px; font-size: 14px; flex: 1; min-width: 180px;
    }
    .btn {
      background: #fff; color: #1a73e8; border: none; border-radius: 6px;
      padding: 7px 14px; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .container { max-width: 1200px; margin: 16px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column;
    }
    .card img { width: 100%; height: 210px; object-fit: cover; background: #eee; border-bottom: 1px solid #eee; }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 16px; font-weight: bold; color: #1a73e8; margin: 0 0 8px 0; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .row { font-size: 13px; margin-bottom: 5px; line-height: 1.5; }
    .label { font-weight: bold; color: #555; }
    .map-link {
      margin-top: auto; display: block; text-align: center; background: #34a853; color: #fff;
      text-decoration: none; padding: 9px; border-radius: 6px; font-weight: bold; font-size: 14px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📍 現場勘查與設施照片即時圖台</h1>
  <span class="badge" id="status">準備讀取...</span>
  <input type="text" class="search-box" id="kw" placeholder="搜尋地點、位置、日期或說明..." oninput="render()">
  <button class="btn" onclick="loadData()">🔄 立即同步</button>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwCRRutky3s005vMyGbJCeSg5q8OtKu_qTBXqtWDHHehR8yKGfuQ-E2OXsaJP63MJOVrQ/exec";

  let allPoints = [];

  async function loadData() {
    const status = document.getElementById('status');
    status.innerText = "同步資料中...";
    try {
      const res = await fetch(GAS_URL + "?action=data");
      const json = await res.json();
      if (json.status === "ok") {
        allPoints = json.points || [];
        render();
      } else {
        status.innerText = "讀取錯誤：" + json.message;
      }
    } catch (err) {
      status.innerText = "連線異常，請確認已部署新版本";
    }
  }

  function render() {
    const kw = document.getElementById('kw').value.trim().toLowerCase();
    const list = kw ? allPoints.filter(p =>
      (p.title + p.desc + p.date + (p.address || "")).toLowerCase().includes(kw)
    ) : allPoints;

    document.getElementById('status').innerText = `共 ${list.length} 筆資料`;
    const grid = document.getElementById('grid');

    if (list.length === 0) {
      grid.innerHTML = "<p>目前沒有符合的巡檢紀錄。</p>";
      return;
    }

    grid.innerHTML = list.map(p => {
      const combinedTitle = `${esc(p.title)}｜${esc(p.desc)}`;
      const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
      return `
        <div class="card">
          ${p.photoUrl ? `<a href="${p.originalLink}" target="_blank"><img src="${p.photoUrl}" alt="現場照片"></a>` : ''}
          <div class="card-body">
            <div class="card-title">${combinedTitle}</div>
            <div class="row"><span class="label">📍 地點：</span>${esc(p.title)}</div>
            <div class="row"><span class="label">🗺️ 位置：</span>${esc(p.address || "依 GPS 座標定位")}</div>
            <div class="row"><span class="label">🌐 座標：</span>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
            <div class="row"><span class="label">📅 日期：</span>${esc(p.date)}</div>
            <div class="row"><span class="label">📝 說明：</span>${esc(p.desc)}</div>
            <a class="map-link" href="${gmapUrl}" target="_blank">🗺️ 在 Google 地圖開啟定位</a>
          </div>
        </div>
      `;
    }).join('');
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  loadData();
</script>
</body>
</html>
